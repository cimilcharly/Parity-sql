# Parity Knowledge Base: Oracle to PostgreSQL Semantic Differences
# Catalog of known silent divergences, compilation traps, and transpilation remedies.

version: "1.0"
differences:
  - id: "ORA_DIFF_001"
    title: "Empty String Evaluated as NULL"
    severity: "HIGH"
    category: "SEMANTICS"
    oracle_behavior: "An empty string literal '' is treated as NULL. col IS NULL and col = '' are identical."
    postgres_behavior: "An empty string '' is a distinct VARCHAR of length 0. '' IS NULL is FALSE."
    symptom: "Row count mismatch or missing rows in WHERE clauses filtering empty strings."
    remedy: "Use NULLIF(col, '') or explicit COALESCE checks."
    sql_example_oracle: "SELECT * FROM employees WHERE phone_number = '';"
    sql_example_postgres: "SELECT * FROM employees WHERE phone_number IS NULL OR phone_number = '';"

  - id: "ORA_DIFF_002"
    title: "String Concatenation with NULL"
    severity: "HIGH"
    category: "EXPRESSION"
    oracle_behavior: "'a' || NULL evaluates to 'a'."
    postgres_behavior: "'a' || NULL evaluates to NULL according to ANSI standard."
    symptom: "Entire concatenated strings become NULL unexpectedly in PostgreSQL."
    remedy: "Replace || with CONCAT(a, b) or wrap nullable arguments with COALESCE(arg, '')."
    sql_example_oracle: "SELECT first_name || ' ' || last_name FROM employees;"
    sql_example_postgres: "SELECT CONCAT(first_name, ' ', last_name) FROM employees;"

  - id: "ORA_DIFF_003"
    title: "DATE Datatype Precision"
    severity: "HIGH"
    category: "DATATYPE"
    oracle_behavior: "DATE includes year, month, day, hour, minute, and second (e.g. 2026-10-17 19:30:00)."
    postgres_behavior: "DATE stores calendar date only (2026-10-17). Time component is discarded."
    symptom: "Time comparison fails or time data is truncated."
    remedy: "Map Oracle DATE columns to PostgreSQL TIMESTAMP WITHOUT TIME ZONE."
    sql_example_oracle: "SELECT hire_date FROM employees WHERE hire_date > TO_DATE('2005-01-01', 'YYYY-MM-DD');"
    sql_example_postgres: "SELECT hire_date FROM employees WHERE hire_date > '2005-01-01'::timestamp;"

  - id: "ORA_DIFF_004"
    title: "NVL and NVL2 Functions"
    severity: "MEDIUM"
    category: "FUNCTION"
    oracle_behavior: "NVL(a, b) replaces null with b. NVL2(a, b, c) returns b if a is not null, else c."
    postgres_behavior: "NVL does not exist natively."
    symptom: "PostgreSQL function does not exist error: nvl()."
    remedy: "Rewrite NVL(a, b) to COALESCE(a, b) and NVL2(a, b, c) to CASE WHEN a IS NOT NULL THEN b ELSE c END."
    sql_example_oracle: "SELECT NVL(commission_pct, 0) FROM employees;"
    sql_example_postgres: "SELECT COALESCE(commission_pct, 0) FROM employees;"

  - id: "ORA_DIFF_005"
    title: "DECODE Function"
    severity: "MEDIUM"
    category: "FUNCTION"
    oracle_behavior: "DECODE(val, s1, r1, s2, r2, default) evaluates equality, treating NULL = NULL as TRUE."
    postgres_behavior: "DECODE is for byte string decoding, not conditional branching."
    symptom: "Function decode() parameter mismatch or invalid syntax."
    remedy: "Rewrite to standard CASE WHEN expressions."
    sql_example_oracle: "SELECT DECODE(department_id, 10, 'Admin', 20, 'Marketing', 'Other') FROM departments;"
    sql_example_postgres: "SELECT CASE department_id WHEN 10 THEN 'Admin' WHEN 20 THEN 'Marketing' ELSE 'Other' END FROM departments;"

  - id: "ORA_DIFF_006"
    title: "ROWNUM Pseudo-Column and Pagination"
    severity: "HIGH"
    category: "QUERY_EXECUTION"
    oracle_behavior: "ROWNUM is assigned dynamically as rows are fetched; WHERE ROWNUM <= 10 filters before ORDER BY."
    postgres_behavior: "PostgreSQL uses LIMIT / OFFSET or ROW_NUMBER() OVER ()."
    symptom: "Unrecognized column 'rownum' or inverted sorting order."
    remedy: "Use LIMIT n OFFSET m or window function ROW_NUMBER() OVER (ORDER BY ...)."
    sql_example_oracle: "SELECT * FROM (SELECT * FROM employees ORDER BY salary DESC) WHERE ROWNUM <= 5;"
    sql_example_postgres: "SELECT * FROM employees ORDER BY salary DESC LIMIT 5;"

  - id: "ORA_DIFF_007"
    title: "Legacy (+) Outer Join Operator"
    severity: "HIGH"
    category: "SYNTAX"
    oracle_behavior: "WHERE a.id = b.id(+) indicates a LEFT OUTER JOIN."
    postgres_behavior: "(+) is a syntax error in PostgreSQL."
    symptom: "Syntax error at or near '+'."
    remedy: "Rewrite WHERE joins into standard ANSI LEFT/RIGHT OUTER JOIN syntax."
    sql_example_oracle: "SELECT d.department_name, e.last_name FROM departments d, employees e WHERE d.department_id = e.department_id(+);"
    sql_example_postgres: "SELECT d.department_name, e.last_name FROM departments d LEFT JOIN employees e ON d.department_id = e.department_id;"

  - id: "ORA_DIFF_008"
    title: "Sequence NextVal and CurrVal Syntax"
    severity: "MEDIUM"
    category: "SYNTAX"
    oracle_behavior: "sequence_name.NEXTVAL and sequence_name.CURRVAL."
    postgres_behavior: "nextval('sequence_name') and currval('sequence_name')."
    symptom: "Unknown column sequence_name.nextval."
    remedy: "Replace with nextval('sequence_name') function call."
    sql_example_oracle: "SELECT employee_seq.NEXTVAL FROM dual;"
    sql_example_postgres: "SELECT nextval('employee_seq');"

  - id: "ORA_DIFF_009"
    title: "SYSDATE vs CURRENT_TIMESTAMP"
    severity: "MEDIUM"
    category: "FUNCTION"
    oracle_behavior: "SYSDATE returns server date and time as a DATE."
    postgres_behavior: "CURRENT_TIMESTAMP or clock_timestamp()."
    symptom: "Column 'sysdate' does not exist."
    remedy: "Transpile SYSDATE to CURRENT_TIMESTAMP or NOW()."
    sql_example_oracle: "SELECT SYSDATE FROM dual;"
    sql_example_postgres: "SELECT CURRENT_TIMESTAMP;"

  - id: "ORA_DIFF_010"
    title: "TRUNC Date Function"
    severity: "MEDIUM"
    category: "FUNCTION"
    oracle_behavior: "TRUNC(date, 'MM') truncates to first of month."
    postgres_behavior: "date_trunc('month', timestamp) requires reversed parameter order."
    symptom: "Function trunc(timestamp, unknown) does not exist."
    remedy: "Rewrite to date_trunc('unit', date)."
    sql_example_oracle: "SELECT TRUNC(hire_date, 'MM') FROM employees;"
    sql_example_postgres: "SELECT date_trunc('month', hire_date) FROM employees;"

  - id: "ORA_DIFF_011"
    title: "Identifier Casing and Quoting"
    severity: "HIGH"
    category: "SCHEMA"
    oracle_behavior: "Unquoted identifiers are folded to UPPERCASE."
    postgres_behavior: "Unquoted identifiers are folded to lowercase."
    symptom: "Relation or column not found when mixing quoted and unquoted identifiers."
    remedy: "Normalize identifiers to lowercase in PostgreSQL migrations."
    sql_example_oracle: "SELECT \"EMPLOYEE_ID\" FROM employees;"
    sql_example_postgres: "SELECT employee_id FROM employees;"

  - id: "ORA_DIFF_012"
    title: "ADD_MONTHS Function"
    severity: "LOW"
    category: "FUNCTION"
    oracle_behavior: "ADD_MONTHS(date, n) adds n calendar months."
    postgres_behavior: "Requires date + (n * INTERVAL '1 month')."
    symptom: "Function add_months() does not exist."
    remedy: "Rewrite using date arithmetic with interval."
    sql_example_oracle: "SELECT ADD_MONTHS(hire_date, 6) FROM employees;"
    sql_example_postgres: "SELECT hire_date + INTERVAL '6 month' FROM employees;"

  - id: "ORA_DIFF_013"
    title: "INSTR Function Parameterization"
    severity: "LOW"
    category: "FUNCTION"
    oracle_behavior: "INSTR(string, sub, start, occurrence)."
    postgres_behavior: "STRPOS(string, sub) or POSITION(sub IN string)."
    symptom: "Function instr() not found."
    remedy: "Use strpos() for basic index search or regex for nth occurrence."
    sql_example_oracle: "SELECT INSTR(email, '@') FROM employees;"
    sql_example_postgres: "SELECT STRPOS(email, '@') FROM employees;"

  - id: "ORA_DIFF_014"
    title: "SUBSTR Negative Start Position"
    severity: "MEDIUM"
    category: "FUNCTION"
    oracle_behavior: "SUBSTR(str, -3) takes last 3 characters."
    postgres_behavior: "substr(str, pos) does not accept negative start indexing."
    symptom: "Empty string returned or out-of-range index."
    remedy: "Use RIGHT(str, n) or substring(str from length(str) - n + 1)."
    sql_example_oracle: "SELECT SUBSTR(phone_number, -4) FROM employees;"
    sql_example_postgres: "SELECT RIGHT(phone_number, 4) FROM employees;"

  - id: "ORA_DIFF_015"
    title: "FROM DUAL Dummy Table"
    severity: "LOW"
    category: "SYNTAX"
    oracle_behavior: "FROM DUAL is required for scalar queries without tables."
    postgres_behavior: "FROM clause is optional."
    symptom: "Relation 'dual' does not exist."
    remedy: "Strip FROM DUAL."
    sql_example_oracle: "SELECT 1 + 1 FROM DUAL;"
    sql_example_postgres: "SELECT 1 + 1;"
