name: Parity CI & Semantic Verification Stack

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  test-suite:
    name: Run Parity Unit & Golden-File Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest pytest-cov

      - name: Run System Doctor
        run: |
          parity doctor

      - name: Run Full Test Suite
        run: |
          pytest --maxfail=1 --disable-warnings -v

      - name: Run Pinned Ablation Study Matrix
        run: |
          parity ablation

      - name: Verify Topological Lineage & Cyclic Dependency Guard
        run: |
          parity lineage src/parity/benchmark/corpus
