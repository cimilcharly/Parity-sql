name: Deploy Showcase Web App to GitHub Pages

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy-pages:
    name: Deploy Docs & Showcase to GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # Auto-enabling Pages needs a PAT (repo scope) stored as PAGES_ADMIN_TOKEN;
      # GITHUB_TOKEN cannot enable Pages. Without the secret, enable Pages manually
      # (Settings -> Pages -> Source: GitHub Actions).
      - name: Setup Pages
        uses: actions/configure-pages@v6
        with:
          enablement: ${{ secrets.PAGES_ADMIN_TOKEN != '' }}
          token: ${{ secrets.PAGES_ADMIN_TOKEN || github.token }}

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: './docs'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
