[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "parity-sql"
version = "0.1.0"
description = "Deterministic-first Oracle to PostgreSQL SQL transpilation with multi-layer semantic verification"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Parity Project Contributors" }
]
keywords = ["sql", "oracle", "postgresql", "migration", "transpiler", "verification", "sqlglot"]
dependencies = [
    "sqlglot>=25.0.0",
    "oracledb>=2.0.0",
    "psycopg[binary]>=3.1.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0.0",
    "rich>=13.0.0",
    "typer>=0.12.0",
    "jinja2>=3.1.0",
    "faker>=20.0.0",
    "python-dotenv>=1.0.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.4.0",
    "mypy>=1.9.0"
]

[project.scripts]
parity = "parity.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v"

[tool.ruff]
line-length = 100
target-version = "py311"
